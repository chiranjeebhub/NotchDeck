name: Build

on:
  push:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build app bundle
        run: ./scripts/build-app.sh
      - name: Zip app
        run: cd build && ditto -c -k --keepParent NotchUtility.app NotchUtility.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NotchUtility
          path: build/NotchUtility.zip
